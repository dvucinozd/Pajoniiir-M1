[workspace]
members = [
    "apps/desktop-simulator",
    "crates/pajoniiir-audio-dsp",
    "crates/pajoniiir-audio-keylock",
    "crates/pajoniiir-audio-runtime",
    "crates/pajoniiir-core",
    "crates/pajoniiir-controller-core",
    "crates/pajoniiir-controller-profile",
    "crates/pajoniiir-controller-session",
    "crates/pajoniiir-control-scheduler",
    "crates/pajoniiir-deck",
    "crates/pajoniiir-hot-cues",
    "crates/pajoniiir-mixer",
    "crates/pajoniiir-track-analysis",
    "crates/pajoniiir-ui-model",
    "crates/pajoniiir-waveform",
]
default-members = [
    "apps/desktop-simulator",
    "crates/pajoniiir-audio-dsp",
    "crates/pajoniiir-audio-keylock",
    "crates/pajoniiir-audio-runtime",
    "crates/pajoniiir-core",
    "crates/pajoniiir-controller-core",
    "crates/pajoniiir-controller-profile",
    "crates/pajoniiir-controller-session",
    "crates/pajoniiir-control-scheduler",
    "crates/pajoniiir-deck",
    "crates/pajoniiir-hot-cues",
    "crates/pajoniiir-mixer",
    "crates/pajoniiir-track-analysis",
    "crates/pajoniiir-ui-model",
    "crates/pajoniiir-waveform",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95.0"
publish = false

[workspace.dependencies]
embedded-graphics = { version = "=0.8.2", default-features = false }
libm = "=0.2.16"
slint = { version = "=1.18.1", default-features = false, features = ["std", "backend-winit-x11", "renderer-software", "compat-1-18"] }
slint-build = { version = "=1.18.1" }

pajoniiir-audio-dsp = { path = "crates/pajoniiir-audio-dsp" }
pajoniiir-audio-keylock = { path = "crates/pajoniiir-audio-keylock" }
pajoniiir-audio-runtime = { path = "crates/pajoniiir-audio-runtime" }
pajoniiir-core = { path = "crates/pajoniiir-core" }
pajoniiir-controller-core = { path = "crates/pajoniiir-controller-core" }
pajoniiir-controller-profile = { path = "crates/pajoniiir-controller-profile" }
pajoniiir-controller-session = { path = "crates/pajoniiir-controller-session" }
pajoniiir-control-scheduler = { path = "crates/pajoniiir-control-scheduler" }
pajoniiir-deck = { path = "crates/pajoniiir-deck" }
pajoniiir-hot-cues = { path = "crates/pajoniiir-hot-cues" }
pajoniiir-mixer = { path = "crates/pajoniiir-mixer" }
pajoniiir-track-analysis = { path = "crates/pajoniiir-track-analysis" }
pajoniiir-ui-model = { path = "crates/pajoniiir-ui-model" }
pajoniiir-waveform = { path = "crates/pajoniiir-waveform" }

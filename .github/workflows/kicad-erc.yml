name: KiCad 9 schematic ERC

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "hardware/Pajoniiir-M1/**/*.kicad_sch"
      - "hardware/Pajoniiir-M1/**/*.kicad_sym"
      - "hardware/Pajoniiir-M1/**/*.kicad_mod"
      - "hardware/Pajoniiir-M1/*.kicad_pro"
      - "hardware/Pajoniiir-M1/sym-lib-table"
      - "hardware/Pajoniiir-M1/fp-lib-table"
      - "hardware/Pajoniiir-M1/tools/validate_schematic_structure.py"
      - ".github/workflows/kicad-erc.yml"

concurrency:
  group: kicad-erc-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  schematic-erc:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install KiCad 9
        shell: bash
        run: |
          sudo add-apt-repository --yes ppa:kicad/kicad-9.0-releases
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends kicad kicad-symbols kicad-footprints
          kicad-cli version

      - name: Structural schematic contracts
        run: python3 hardware/Pajoniiir-M1/tools/validate_schematic_structure.py

      - name: Root loader delta diagnostics
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/paj-root-diag
          mkdir -p /tmp/paj-root-diag
          cp hardware/Pajoniiir-M1/*.kicad_sch /tmp/paj-root-diag/

          python3 - <<'PY'
          from __future__ import annotations
          from pathlib import Path
          import re

          base = Path("/tmp/paj-root-diag")
          root = base / "Pajoniiir-M1.kicad_sch"
          text = root.read_text(encoding="utf-8")

          def sexpr_at(src: str, start: int) -> tuple[str, int]:
              depth = 0
              in_string = False
              escaped = False
              begun = False
              for i in range(start, len(src)):
                  ch = src[i]
                  if in_string:
                      if escaped:
                          escaped = False
                          continue
                      if ch == "\\":
                          escaped = True
                          continue
                      if ch == '"':
                          in_string = False
                      continue
                  if ch == '"':
                      in_string = True
                      continue
                  if ch == "(":
                      depth += 1
                      begun = True
                  elif ch == ")":
                      depth -= 1
                      if begun and depth == 0:
                          return src[start : i + 1], i + 1
              raise ValueError("unterminated s-expression")

          start = text.index("(kicad_sch")
          pos = start + len("(kicad_sch")
          items: list[tuple[str, str]] = []
          while pos < len(text):
              while pos < len(text) and text[pos].isspace():
                  pos += 1
              if text[pos] == ")":
                  break
              block, pos = sexpr_at(text, pos)
              token = re.match(r"\(([^\s()]+)", block).group(1)
              items.append((token, block))

          header_tokens = {
              "version", "generator", "generator_version", "uuid",
              "paper", "title_block", "lib_symbols"
          }
          tail_tokens = {"sheet_instances", "embedded_fonts"}

          sheets = [(tok, block) for tok, block in items if tok == "sheet"]
          sheet_names: list[str] = []
          for _, block in sheets:
              m = re.search(r'\(property "Sheetname" "([^"]+)"', block)
              sheet_names.append(m.group(1) if m else "UNKNOWN")

          def emit(name: str, keep) -> None:
              selected = [block for token, block in items if keep(token, block)]
              body = "\n".join("  " + block.lstrip() for block in selected)
              (base / f"diag_{name}.kicad_sch").write_text(
                  "(kicad_sch\n" + body + "\n)\n",
                  encoding="utf-8",
              )

          emit("no_sheets", lambda token, block: token != "sheet")
          emit(
              "sheets_only",
              lambda token, block: token in header_tokens
              or token == "sheet"
              or token in tail_tokens,
          )
          emit("no_labels", lambda token, block: token != "label")
          emit("no_wires", lambda token, block: token != "wire")
          emit(
              "no_wires_labels",
              lambda token, block: token not in {"wire", "label"},
          )

          for idx, sheet_name in enumerate(sheet_names):
              safe = re.sub(r"[^A-Za-z0-9_]+", "_", sheet_name)
              target = sheets[idx][1]
              emit(
                  f"single_{idx+1:02d}_{safe}",
                  lambda token, block, target=target: (
                      token in header_tokens
                      or token in tail_tokens
                      or (token == "sheet" and block == target)
                  ),
              )

          midpoint = len(sheets) // 2
          first = {block for _, block in sheets[:midpoint]}
          second = {block for _, block in sheets[midpoint:]}
          emit(
              "sheets_first_half",
              lambda token, block: token in header_tokens
              or token in tail_tokens
              or (token == "sheet" and block in first),
          )
          emit(
              "sheets_second_half",
              lambda token, block: token in header_tokens
              or token in tail_tokens
              or (token == "sheet" and block in second),
          )
          print(f"Generated {5 + len(sheets) + 2} diagnostic roots")
          PY

          cd /tmp/paj-root-diag
          for schematic in Pajoniiir-M1.kicad_sch diag_*.kicad_sch; do
            report="/tmp/$(basename "$schematic" .kicad_sch).diag.rpt"
            set +e
            kicad-cli sch erc --severity-error --output "$report" "$schematic" \
              >/tmp/paj-diag.stdout 2>/tmp/paj-diag.stderr
            rc=$?
            set -e
            printf 'ROOT-DIAG rc=%d file=%s\n' "$rc" "$schematic"
            if [[ "$rc" -ne 0 ]]; then
              sed 's/^/  stderr: /' /tmp/paj-diag.stderr || true
            fi
          done

          # Distinguish hierarchy loading from ERC-specific crashes.
          for schematic in \
            Pajoniiir-M1.kicad_sch \
            diag_single_03_03_P4_CORE.kicad_sch \
            diag_single_06_06_USB_POWER.kicad_sch \
            diag_single_10_10_DISPLAY_MIPI.kicad_sch \
            diag_single_14_14_TEST_MONITORING.kicad_sch; do
            set +e
            kicad-cli sch export netlist \
              --output "/tmp/$(basename "$schematic" .kicad_sch).net" \
              "$schematic" >/tmp/paj-net.stdout 2>/tmp/paj-net.stderr
            rc=$?
            set -e
            printf 'ROOT-NETLIST rc=%d file=%s\n' "$rc" "$schematic"
            if [[ "$rc" -ne 0 ]]; then
              sed 's/^/  net-stderr: /' /tmp/paj-net.stderr || true
            fi
          done
          cd -

          # Test whether standalone child sheet_instances metadata is poisoning
          # hierarchy resolution. Official KiCad shared child sheets omit it.
          for mode in strip4 stripall stripall_fonts; do
            rm -rf "/tmp/paj-root-$mode"
            cp -a /tmp/paj-root-diag "/tmp/paj-root-$mode"
          done

          python3 - <<'PY'
          from pathlib import Path

          problem = {
              "03_P4_CORE.kicad_sch",
              "06_USB_POWER.kicad_sch",
              "10_DISPLAY_MIPI.kicad_sch",
              "14_TEST_MONITORING.kicad_sch",
          }
          all_children = {
              p.name
              for p in Path("/tmp/paj-root-diag").glob("[0-9][0-9]_*.kicad_sch")
          }

          def sexpr_at(src: str, start: int) -> tuple[str, int]:
              depth = 0
              in_string = False
              escaped = False
              begun = False
              for i in range(start, len(src)):
                  ch = src[i]
                  if in_string:
                      if escaped:
                          escaped = False
                          continue
                      if ch == "\\":
                          escaped = True
                          continue
                      if ch == '"':
                          in_string = False
                      continue
                  if ch == '"':
                      in_string = True
                      continue
                  if ch == "(":
                      depth += 1
                      begun = True
                  elif ch == ")":
                      depth -= 1
                      if begun and depth == 0:
                          return src[start : i + 1], i + 1
              raise ValueError("unterminated s-expression")

          def remove_top_token(path: Path, token: str) -> None:
              text = path.read_text(encoding="utf-8")
              start = text.rfind(f"({token}")
              if start < 0:
                  return
              _, end = sexpr_at(text, start)
              text = text[:start] + text[end:]
              path.write_text(text, encoding="utf-8")

          modes = {
              "strip4": (problem, False),
              "stripall": (all_children, False),
              "stripall_fonts": (all_children, True),
          }
          for mode, (targets, remove_fonts) in modes.items():
              base = Path(f"/tmp/paj-root-{mode}")
              for name in targets:
                  path = base / name
                  remove_top_token(path, "sheet_instances")
                  if remove_fonts:
                      remove_top_token(path, "embedded_fonts")
          PY

          for mode in strip4 stripall stripall_fonts; do
            cd "/tmp/paj-root-$mode"
            for schematic in \
              Pajoniiir-M1.kicad_sch \
              diag_single_03_03_P4_CORE.kicad_sch \
              diag_single_06_06_USB_POWER.kicad_sch \
              diag_single_10_10_DISPLAY_MIPI.kicad_sch \
              diag_single_14_14_TEST_MONITORING.kicad_sch; do
              set +e
              kicad-cli sch erc --severity-error \
                --output "/tmp/$mode-$(basename "$schematic" .kicad_sch).rpt" \
                "$schematic" >/tmp/paj-child.stdout 2>/tmp/paj-child.stderr
              rc=$?
              set -e
              printf 'ROOT-DIAG-CHILD mode=%s rc=%d file=%s\n' \
                "$mode" "$rc" "$schematic"
            done
            cd -
          done

      - name: KiCad schematic load preflight
        shell: bash
        run: |
          failed=0
          while IFS= read -r schematic; do
            name="$(basename "$schematic" .kicad_sch)"
            stdout="/tmp/${name}.stdout"
            stderr="/tmp/${name}.stderr"
            report="/tmp/${name}.rpt"
            set +e
            kicad-cli sch erc \
              --severity-error \
              --output "$report" \
              "$schematic" >"$stdout" 2>"$stderr"
            rc=$?
            set -e
            if [[ "$rc" -eq 0 ]]; then
              echo "LOAD OK: $schematic"
            else
              echo "::error file=$schematic::KiCad load/ERC preflight failed with exit code $rc"
              cat "$stdout" || true
              cat "$stderr" || true
              failed=1
            fi
          done < <(find hardware/Pajoniiir-M1 -maxdepth 1 -name '*.kicad_sch' -print | sort)
          exit "$failed"

      - name: Native KiCad ERC
        id: erc
        shell: bash
        run: |
          mkdir -p artifacts
          set +e
          kicad-cli sch erc \
            --format json \
            --severity-all \
            --exit-code-violations \
            --output artifacts/Pajoniiir-M1-erc.json \
            hardware/Pajoniiir-M1/Pajoniiir-M1.kicad_sch
          rc=$?
          set -e
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          if [[ "$rc" -ne 0 && "$rc" -ne 5 ]]; then
            echo "kicad-cli failed with unexpected exit code $rc"
            exit "$rc"
          fi

      - name: Upload ERC report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Pajoniiir-M1-KiCad9-ERC
          path: artifacts/Pajoniiir-M1-erc.json
          if-no-files-found: warn

      - name: Enforce zero unexplained ERC errors
        if: always()
        shell: bash
        run: |
          rc="${{ steps.erc.outputs.exit_code }}"
          if [[ -z "$rc" ]]; then
            echo "ERC step did not produce an exit code."
            exit 1
          fi
          if [[ "$rc" -ne 0 && "$rc" -ne 5 ]]; then
            exit "$rc"
          fi
          python3 - <<'PY'
          import json
          from pathlib import Path

          report = Path("artifacts/Pajoniiir-M1-erc.json")
          if not report.is_file():
              raise SystemExit("ERC JSON report is missing")

          data = json.loads(report.read_text(encoding="utf-8"))
          unexplained = []
          excluded_errors = []
          warnings = []
          for sheet in data.get("sheets", []):
              path = sheet.get("path", "?")
              for violation in sheet.get("violations", []):
                  severity = violation.get("severity")
                  excluded = bool(violation.get("excluded", False))
                  entry = (
                      path,
                      violation.get("type", "?"),
                      violation.get("description", ""),
                  )
                  if severity == "error":
                      if excluded:
                          excluded_errors.append(entry)
                      else:
                          unexplained.append(entry)
                  elif severity == "warning" and not excluded:
                      warnings.append(entry)

          print(
              f"ERC summary: unexplained_errors={len(unexplained)} "
              f"excluded_errors={len(excluded_errors)} warnings={len(warnings)}"
          )
          for path, kind, desc in unexplained:
              print(f"UNEXPLAINED ERROR {path}: {kind}: {desc}")

          if unexplained:
              raise SystemExit(1)
          PY

name: Mechanical authority contracts

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "hardware/Pajoniiir-M1/dsi506_*evidence*.json"
      - "hardware/Pajoniiir-M1/dsi506_*lock*.json"
      - "hardware/Pajoniiir-M1/dsi506_mainboard_mount_candidate_b2.json"
      - "hardware/Pajoniiir-M1/m1_mech_b3_*.json"
      - "hardware/Pajoniiir-M1/m1_mech_b4_*.json"
      - "hardware/Pajoniiir-M1/m1_mech_b5_*.json"
      - "hardware/Pajoniiir-M1/final_display_module.json"
      - "hardware/Pajoniiir-M1/display_connector_b1.json"
      - "hardware/Pajoniiir-M1/mechanical_gates.json"
      - "hardware/Pajoniiir-M1/mech_a.json"
      - "hardware/Pajoniiir-M1/pcb_constraints.json"
      - "hardware/Pajoniiir-M1/Pajoniiir-M1.kicad_pcb"
      - "hardware/Pajoniiir-M1/10_DISPLAY_MIPI.kicad_sch"
      - "hardware/Pajoniiir-M1/tools/validate_mechanical_authority.py"
      - "hardware/Pajoniiir-M1/tools/validate_b4_panel_windows.py"
      - "hardware/Pajoniiir-M1/tools/validate_b5_placement_skeleton.py"
      - ".github/workflows/mechanical-authority.yml"

concurrency:
  group: mechanical-authority-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate B2 B3 B4 mechanical authority
        run: python3 hardware/Pajoniiir-M1/tools/validate_mechanical_authority.py

      - name: Validate B4 panel and FFC windows
        run: python3 hardware/Pajoniiir-M1/tools/validate_b4_panel_windows.py

      - name: Validate B5 placement skeleton
        run: python3 hardware/Pajoniiir-M1/tools/validate_b5_placement_skeleton.py

      - name: Verify JSON syntax for current mechanical authorities
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          base = Path('hardware/Pajoniiir-M1')
          paths = sorted(
              list(base.glob('dsi506_*evidence*.json'))
              + list(base.glob('dsi506_*lock*.json'))
              + list(base.glob('m1_mech_b3_*.json'))
              + list(base.glob('m1_mech_b4_*.json'))
              + list(base.glob('m1_mech_b5_*.json'))
          )
          seen = set()
          for path in paths:
              if path in seen:
                  continue
              seen.add(path)
              json.loads(path.read_text(encoding='utf-8'))
              print(f'JSON OK: {path}')
          print(f'PASS: {len(seen)} mechanical authority JSON files parsed')
          PY

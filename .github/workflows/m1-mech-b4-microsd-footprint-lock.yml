name: M1 MECH B4 microSD footprint lock

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/m1-mech-b4-microsd-footprint-lock.yml"

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install KiCad 9 and converter
        shell: bash
        run: |
          set -euo pipefail
          sudo add-apt-repository --yes ppa:kicad/kicad-9.0-releases >/dev/null
          sudo apt-get update -qq
          sudo apt-get install --yes --no-install-recommends kicad kicad-symbols kicad-footprints >/dev/null
          python3 -m pip install --user easyeda2kicad >/dev/null
          kicad-cli version
          test -f /usr/share/kicad/symbols/Connector.kicad_sym

      - name: Import exact Molex ECAD and apply audited migration
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/microsd
          mkdir -p /tmp/microsd
          "$HOME/.local/bin/easyeda2kicad" --footprint --lcsc_id=C428492 --output /tmp/microsd/molex
          imported=(/tmp/microsd/molex.pretty/*.kicad_mod)
          test "${#imported[@]}" -eq 1
          python3 hardware/Pajoniiir-M1/tools/migrate_b4_microsd_footprint.py \
            --imported-footprint "${imported[0]}" \
            --connector-lib /usr/share/kicad/symbols/Connector.kicad_sym

          python3 hardware/Pajoniiir-M1/tools/validate_schematic_structure.py
          python3 hardware/Pajoniiir-M1/tools/validate_mechanical_authority.py
          python3 hardware/Pajoniiir-M1/tools/validate_b4_panel_windows.py

          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('hardware/Pajoniiir-M1/libraries/footprints.pretty/Molex_503398-1892.kicad_mod')
          t=p.read_text()
          assert '/tmp/' not in t
          assert 'Molex_503398-1892' in t
          counts={str(i):len(re.findall(rf'\(pad\s+"?{i}"?\s+smd',t)) for i in range(1,11)}
          expected={**{str(i):1 for i in range(1,10)},'10':5}
          assert counts==expected,(counts,expected)
          depth=0; ins=False; esc=False; minimum=0
          for ch in t:
              if ins:
                  if esc: esc=False; continue
                  if ch=='\\': esc=True; continue
                  if ch=='"': ins=False
                  continue
              if ch=='"': ins=True
              elif ch=='(': depth+=1
              elif ch==')': depth-=1; minimum=min(minimum,depth)
          assert depth==0 and minimum>=0,(depth,minimum)
          print('PASS: normalized Molex footprint syntax/pin primitive counts are clean')
          PY

      - name: KiCad load manufacturing and native ERC preflight
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/m1-j7 artifacts
          failed=0
          while IFS= read -r schematic; do
            name="$(basename "$schematic" .kicad_sch)"
            set +e
            kicad-cli sch erc --severity-error --output "/tmp/m1-j7/${name}.rpt" "$schematic" >/tmp/m1-j7/stdout 2>/tmp/m1-j7/stderr
            rc=$?
            set -e
            if [[ "$rc" -ne 0 ]]; then
              echo "LOAD/ERROR ERC FAIL: $schematic rc=$rc"
              cat /tmp/m1-j7/stderr || true
              failed=1
            fi
          done < <(find hardware/Pajoniiir-M1 -maxdepth 1 -name '*.kicad_sch' -print | sort)
          test "$failed" -eq 0

          kicad-cli sch export bom \
            --output artifacts/Pajoniiir-M1-manufacturing-bom.csv \
            --fields 'Reference,Value,Footprint,${QUANTITY},${DNP}' \
            --labels 'Refs,Value,Footprint,Qty,DNP' \
            --sort-field 'Reference' --sort-asc --string-delimiter '"' \
            hardware/Pajoniiir-M1/Pajoniiir-M1.kicad_sch
          python3 hardware/Pajoniiir-M1/tools/validate_manufacturing_outputs.py \
            artifacts/Pajoniiir-M1-manufacturing-bom.csv \
            artifacts/Pajoniiir-M1-manufacturing-bom-audit.md

          kicad-cli sch export netlist --format kicadxml \
            --output /tmp/m1-j7/Pajoniiir-M1.net.xml \
            hardware/Pajoniiir-M1/Pajoniiir-M1.kicad_sch
          kicad-cli sch export pdf --black-and-white \
            --output /tmp/m1-j7/Pajoniiir-M1.pdf \
            hardware/Pajoniiir-M1/Pajoniiir-M1.kicad_sch

          grep -q '503398-1892' artifacts/Pajoniiir-M1-manufacturing-bom.csv
          grep -q 'Pajoniiir-M1:Molex_503398-1892' artifacts/Pajoniiir-M1-manufacturing-bom.csv

          set +e
          kicad-cli sch erc --format json --severity-all --exit-code-violations \
            --output /tmp/m1-j7/Pajoniiir-M1-erc.json \
            hardware/Pajoniiir-M1/Pajoniiir-M1.kicad_sch
          erc_rc=$?
          set -e
          if [[ "$erc_rc" -ne 0 && "$erc_rc" -ne 5 ]]; then exit "$erc_rc"; fi
          python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('/tmp/m1-j7/Pajoniiir-M1-erc.json').read_text())
          bad=[]
          for sheet in data.get('sheets',[]):
              for v in sheet.get('violations',[]):
                  if v.get('excluded'): continue
                  if v.get('severity') in {'error','warning'}:
                      bad.append((sheet.get('path'),v.get('severity'),v.get('type'),v.get('description')))
          if bad:
              for item in bad: print('ERC BAD:',item)
              raise SystemExit(f'unexcluded ERC error/warning count={len(bad)}')
          print('PASS: native ERC has zero unexcluded errors/warnings')
          PY

      - name: Commit validated J7 closure and remove probes
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/m1-mech-b4-microsd-footprint-lock.yml
          rm -f .github/workflows/m1-mech-b4-microsd-footprint-probe.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            hardware/Pajoniiir-M1/12_MICROSD.kicad_sch \
            hardware/Pajoniiir-M1/libraries/footprints.pretty/Molex_503398-1892.kicad_mod \
            hardware/Pajoniiir-M1/mechanical_gates.json \
            hardware/Pajoniiir-M1/m1_mech_b4_connector_source_lock.json \
            .github/workflows/m1-mech-b4-microsd-footprint-lock.yml \
            .github/workflows/m1-mech-b4-microsd-footprint-probe.yml
          git diff --cached --check
          git commit -m "mechanical: lock Molex microSD footprint"
          git push origin HEAD:main

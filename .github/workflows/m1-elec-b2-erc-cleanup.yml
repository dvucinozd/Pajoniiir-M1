name: M1 ELEC B2 final ERC cleanup

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/m1-elec-b2-erc-cleanup.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply deterministic ERC cleanup
        shell: bash
        run: |
          set -euo pipefail
          python3 hardware/Pajoniiir-M1/tools/cleanup_display_dsi506_b2_erc.py
          python3 hardware/Pajoniiir-M1/tools/validate_schematic_structure.py
          git diff --check

      - name: Install KiCad 9
        shell: bash
        run: |
          set -euo pipefail
          sudo add-apt-repository --yes ppa:kicad/kicad-9.0-releases >/dev/null
          sudo apt-get update -qq
          sudo apt-get install --yes --no-install-recommends kicad kicad-symbols kicad-footprints >/dev/null
          kicad-cli version

      - name: Synchronize cached library symbols
        shell: bash
        run: |
          set -euo pipefail
          python3 hardware/Pajoniiir-M1/tools/sync_display_b2_symbol_cache.py
          python3 hardware/Pajoniiir-M1/tools/validate_schematic_structure.py
          git diff --check

      - name: Load every schematic
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r schematic; do
            report="/tmp/$(basename "$schematic" .kicad_sch).rpt"
            kicad-cli sch erc --severity-error --output "$report" "$schematic"
            echo "LOAD OK: $schematic"
          done < <(find hardware/Pajoniiir-M1 -maxdepth 1 -name '*.kicad_sch' -print | sort)

      - name: Manufacturing parity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/m1-b2-clean
          kicad-cli sch export bom \
            --output /tmp/m1-b2-clean/bom.csv \
            --fields 'Reference,Value,Footprint,${QUANTITY},${DNP}' \
            --labels 'Refs,Value,Footprint,Qty,DNP' \
            --sort-field Reference \
            --sort-asc \
            --string-delimiter '"' \
            hardware/Pajoniiir-M1/Pajoniiir-M1.kicad_sch
          python3 hardware/Pajoniiir-M1/tools/validate_manufacturing_outputs.py \
            /tmp/m1-b2-clean/bom.csv /tmp/m1-b2-clean/bom-audit.md
          kicad-cli sch export netlist -o /tmp/m1-b2-clean/root.net hardware/Pajoniiir-M1/Pajoniiir-M1.kicad_sch
          kicad-cli sch export pdf -o /tmp/m1-b2-clean/root.pdf hardware/Pajoniiir-M1/Pajoniiir-M1.kicad_sch
          test -s /tmp/m1-b2-clean/root.net
          test -s /tmp/m1-b2-clean/root.pdf

      - name: Enforce zero-warning ERC
        shell: bash
        run: |
          set -euo pipefail
          set +e
          kicad-cli sch erc \
            --format json \
            --severity-all \
            --exit-code-violations \
            --output /tmp/m1-b2-clean/erc.json \
            hardware/Pajoniiir-M1/Pajoniiir-M1.kicad_sch
          rc=$?
          set -e
          if [[ "$rc" -ne 0 && "$rc" -ne 5 ]]; then
            exit "$rc"
          fi
          python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('/tmp/m1-b2-clean/erc.json').read_text())
          bad=[]
          for sheet in data.get('sheets',[]):
              for v in sheet.get('violations',[]):
                  if v.get('excluded',False):
                      continue
                  if v.get('severity') in ('error','warning'):
                      bad.append((sheet.get('path','?'),v.get('severity'),v.get('type'),v.get('description'),v.get('items',[])))
          print(f'ERC unexcluded error/warning count={len(bad)}')
          for entry in bad:
              print(entry)
          if bad:
              raise SystemExit(1)
          PY

      - name: Commit clean B2 result
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/m1-elec-b2-erc-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hardware/Pajoniiir-M1 .github/workflows/m1-elec-b2-erc-cleanup.yml
          git diff --cached --check
          git commit -m "display: close B2 ERC cleanup"
          git push origin HEAD:main

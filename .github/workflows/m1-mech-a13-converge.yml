name: M1 MECH A13 B2 convergence

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/m1-mech-a13-converge.yml"

permissions:
  contents: write

jobs:
  converge:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply A13 convergence and prove idempotence
        shell: bash
        run: |
          set -euo pipefail
          python3 hardware/Pajoniiir-M1/tools/converge_mech_a_dsi506_b2.py
          git diff -- . ':(exclude).github/workflows/m1-mech-a13-converge.yml' > /tmp/a13-first.diff
          python3 hardware/Pajoniiir-M1/tools/converge_mech_a_dsi506_b2.py
          git diff -- . ':(exclude).github/workflows/m1-mech-a13-converge.yml' > /tmp/a13-second.diff
          cmp /tmp/a13-first.diff /tmp/a13-second.diff
          git diff --check

      - name: Mechanical authority gate
        shell: bash
        run: |
          set -euo pipefail
          python3 hardware/Pajoniiir-M1/tools/validate_mechanical_authority.py
          python3 hardware/Pajoniiir-M1/tools/report_mech_gate_snapshot.py
          python3 hardware/Pajoniiir-M1/tools/report_mech_gate_snapshot.py --json > /tmp/mech-gates.json
          python3 - <<'PY'
          import json
          s=json.load(open('/tmp/mech-gates.json'))
          assert s['layout_freeze_allowed'] is False, s
          assert s['open_layout_blocker_count'] == 12, s
          assert len(s['open_layout_blockers']) == 12, s
          print('PASS: mechanical snapshot remains intentionally fail-closed at 12 physical/EVT blockers')
          PY

      - name: Existing structural contract gate
        shell: bash
        run: |
          set -euo pipefail
          python3 hardware/Pajoniiir-M1/tools/validate_schematic_structure.py

      - name: Install KiCad 9
        shell: bash
        run: |
          set -euo pipefail
          sudo add-apt-repository --yes ppa:kicad/kicad-9.0-releases >/dev/null
          sudo apt-get update -qq
          sudo apt-get install --yes --no-install-recommends kicad kicad-symbols kicad-footprints >/dev/null
          kicad-cli version

      - name: Load every schematic
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r schematic; do
            report="/tmp/$(basename "$schematic" .kicad_sch).a13.rpt"
            kicad-cli sch erc --severity-error --output "$report" "$schematic"
            echo "LOAD OK: $schematic"
          done < <(find hardware/Pajoniiir-M1 -maxdepth 1 -name '*.kicad_sch' -print | sort)

      - name: Manufacturing and native ERC preflight
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/a13-artifacts
          kicad-cli sch export bom \
            --output /tmp/a13-artifacts/Pajoniiir-M1-manufacturing-bom.csv \
            --fields 'Reference,Value,Footprint,${QUANTITY},${DNP}' \
            --labels 'Refs,Value,Footprint,Qty,DNP' \
            --sort-field Reference --sort-asc --string-delimiter '"' \
            hardware/Pajoniiir-M1/Pajoniiir-M1.kicad_sch
          python3 hardware/Pajoniiir-M1/tools/validate_manufacturing_outputs.py \
            /tmp/a13-artifacts/Pajoniiir-M1-manufacturing-bom.csv \
            /tmp/a13-artifacts/Pajoniiir-M1-manufacturing-bom-audit.md
          kicad-cli sch export netlist --format kicadxml \
            --output /tmp/a13-artifacts/Pajoniiir-M1.net.xml \
            hardware/Pajoniiir-M1/Pajoniiir-M1.kicad_sch
          kicad-cli sch export pdf --black-and-white \
            --output /tmp/a13-artifacts/Pajoniiir-M1-schematic.pdf \
            hardware/Pajoniiir-M1/Pajoniiir-M1.kicad_sch
          set +e
          kicad-cli sch erc --format json --severity-all --exit-code-violations \
            --output /tmp/a13-artifacts/Pajoniiir-M1-erc.json \
            hardware/Pajoniiir-M1/Pajoniiir-M1.kicad_sch
          rc=$?
          set -e
          if [[ "$rc" -ne 0 && "$rc" -ne 5 ]]; then exit "$rc"; fi
          python3 - <<'PY'
          import json
          p='/tmp/a13-artifacts/Pajoniiir-M1-erc.json'
          data=json.load(open(p))
          bad=[]
          for sheet in data.get('sheets',[]):
              for v in sheet.get('violations',[]):
                  if not v.get('excluded',False) and v.get('severity') in ('error','warning'):
                      bad.append((sheet.get('path'),v.get('severity'),v.get('type'),v.get('description')))
          print(f'ERC unexcluded error/warning count={len(bad)}')
          for x in bad: print(x)
          if bad: raise SystemExit(1)
          PY
          test -s /tmp/a13-artifacts/Pajoniiir-M1.net.xml
          test -s /tmp/a13-artifacts/Pajoniiir-M1-schematic.pdf

      - name: Commit B2-converged mechanical authority
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/m1-mech-a13-converge.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hardware/Pajoniiir-M1 docs .github/workflows/m1-mech-a13-converge.yml
          git diff --cached --check
          git commit -m "mech: converge M1-MECH-A13 on final DSI506"
          git push origin HEAD:main

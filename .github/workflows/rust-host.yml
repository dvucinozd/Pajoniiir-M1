name: Rust host foundation

on:
  pull_request:
    paths:
      - "firmware-rust/**"
      - "docs/M1_RUST_*.md"
      - "docs/adr/**"
      - ".github/workflows/rust-host.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware-rust

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Slint Linux dependencies
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libfontconfig1-dev \
            libx11-xcb-dev \
            xinput \
            libxcursor-dev \
            libxkbcommon-x11-dev \
            libx11-dev

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt,clippy
          rustup override set 1.95.0

      - name: Generate dependency lock
        run: cargo generate-lockfile

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Unit tests
        run: cargo test --workspace

      - name: Desktop simulator compile gate
        run: cargo check -p desktop-simulator

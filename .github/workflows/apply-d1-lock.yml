name: One-shot D1 source lock

on:
  push:
    paths:
      - '.github/workflows/apply-d1-lock.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-d1-lock:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Patch D1 source and gate atomically
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json

          sch_path = Path('hardware/Pajoniiir-M1/01_POWER_INPUT.kicad_sch')
          sch = sch_path.read_text(encoding='utf-8')

          replacements = [
              ('(property "Value" "5V_TVS_TBD" (at 62.69 61.69 0)',
               '(property "Value" "SMBJ6.0CA-TR" (at 62.69 61.69 0)'),
              ('(property "Footprint" "" (at 59.69 59.69 0)\n      (effects (font (size 1.27 1.27)) (hide yes))\n    )\n\n    (property "Datasheet" "~" (at 59.69 59.69 0)',
               '(property "Footprint" "Diode_SMD:D_SMB" (at 59.69 59.69 0)\n      (effects (font (size 1.27 1.27)) (hide yes))\n    )\n\n    (property "Datasheet" "https://www.st.com/resource/en/datasheet/smbj.pdf" (at 59.69 59.69 0)'),
              ('J1 and D1 exact MPN/footprints remain TBD-MECH/TBD-SURGE. Bulk 220/330/470uF is EVT tuning.',
               'J1 exact mechanical footprint remains TBD-MECH. D1 = ST SMBJ6.0CA-TR / SMB is locked in M1-MECH-A12. Bulk 220/330/470uF remains EVT tuning.')
          ]

          for old, new in replacements:
              count = sch.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one D1 source match, found {count}: {old[:80]!r}')
              sch = sch.replace(old, new, 1)

          if sch.count('(property "Reference" "D1"') != 1:
              raise SystemExit('D1 RefDes uniqueness check failed')
          if sch.count('SMBJ6.0CA-TR') != 2:  # Value + engineering note
              raise SystemExit('D1 MPN occurrence check failed')
          if sch.count('Diode_SMD:D_SMB') != 1:
              raise SystemExit('D1 footprint occurrence check failed')
          if sch.count('https://www.st.com/resource/en/datasheet/smbj.pdf') != 1:
              raise SystemExit('D1 datasheet occurrence check failed')
          if sch.count('(') != sch.count(')'):
              raise SystemExit('schematic S-expression parenthesis count changed')
          sch_path.write_text(sch, encoding='utf-8')

          gate_path = Path('hardware/Pajoniiir-M1/mechanical_gates.json')
          data = json.loads(gate_path.read_text(encoding='utf-8'))
          matches = [g for g in data['gates'] if g.get('id') == 'D1_INPUT_TVS']
          if len(matches) != 1:
              raise SystemExit(f'expected one D1 gate, found {len(matches)}')
          gate = matches[0]
          candidate = gate.get('preferred_lock_candidate', {})
          if candidate.get('mpn') != 'SMBJ6.0CA-TR' or candidate.get('intended_footprint') != 'Diode_SMD:D_SMB':
              raise SystemExit('D1 preferred candidate contract drifted before closure')

          gate.update({
              'status': 'closed',
              'allow_blank_footprint': False,
              'blocks_layout_freeze': False,
              'closed_revision': 'M1-MECH-A12',
              'closed_date': '2026-09-03',
              'exact_mpn': 'SMBJ6.0CA-TR',
              'exact_footprint': 'Diode_SMD:D_SMB',
              'datasheet': 'https://www.st.com/resource/en/datasheet/smbj.pdf',
              'height_audit': 'PASS: SMB package height max 2.45 mm < 6.5 mm central gross screen',
              'closure': 'CLOSED M1-MECH-A12: ST SMBJ6.0CA-TR bidirectional 6 V TVS in SMB footprint committed to 01_POWER_INPUT and validated by CI.',
          })
          candidate['source_status'] = 'LOCKED_IN_SCHEMATIC_M1-MECH-A12'
          data['updated'] = '2026-09-03'
          gate_path.write_text(json.dumps(data, indent=2) + '\n', encoding='utf-8')

          # Final source/manifest cross-check before commit.
          reparsed = json.loads(gate_path.read_text(encoding='utf-8'))
          d1 = next(g for g in reparsed['gates'] if g['id'] == 'D1_INPUT_TVS')
          if d1['status'] != 'closed' or d1['allow_blank_footprint'] or d1['blocks_layout_freeze']:
              raise SystemExit('D1 gate did not reach the required closed state')
          print('D1 one-shot migration checks PASS')
          PY

      - name: Remove one-shot workflow and commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/apply-d1-lock.yml
          git add hardware/Pajoniiir-M1/01_POWER_INPUT.kicad_sch hardware/Pajoniiir-M1/mechanical_gates.json
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'power: lock D1 input TVS source'
          git push origin HEAD:main

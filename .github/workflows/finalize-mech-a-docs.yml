name: One-shot final MECH-A docs sync

on:
  push:
    paths:
      - '.github/workflows/finalize-mech-a-docs.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-docs:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Update stale A8/A10 snapshots to A12 boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}: {old[:100]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # README current status.
          replace_exact(
              'README.md',
              '**Manufacturing output review:** PASS — current M1-MECH-A8 source baseline 269 in-BOM, 16 DNP, 11 intentional blank-footprint gates  ',
              '**Manufacturing output review:** PASS — M1-MECH-A12 source baseline 269 in-BOM, 16 DNP, 10 intentional blank-footprint gates  '
          )
          replace_exact(
              'README.md',
              '**M1-MECH-A:** IN PROGRESS — M1-MECH-A10 additionally confirms the original LCD FPC is component-side right-angle/side-entry; J_LCD still waits for top/bottom contact-side, exact mating height, final panel variant and 3V3 commonality. J6/J9 are closed; external absolute wall datums and final PCB Z/outline remain open  ',
              '**M1-MECH-A:** REPO-ONLY ANALYSIS COMPLETE THROUGH A12 — D1 TVS, fabrication stackup, J6 and J9 are closed; 12 blockers remain and all require physical/EVT/final-panel evidence. GO for production placement/routing freeze remains blocked.  '
          )
          replace_exact(
              'README.md',
              "Only exact connector/display mechanics, board outline/datums and fab stackup remain before final M1-SCH-A manufacturing sign-off.",
              "Fabrication stackup is now locked to JLCPCB JLC04161H-7628. Remaining sign-off work is physical connector/display mechanics, final board outline/datums, C3/C8 EVT bulk selection, and exact controlled-impedance width/spacing for the locked stackup."
          )
          replace_exact(
              'README.md',
              '- [M1-MECH-A Display FPC Physical Orientation v0.1](docs/Pajoniiir_M1_MECH_A_Display_FPC_Physical_Orientation_v0.1.md)\n- [PCB placement & routing constraints v0.1](docs/Pajoniiir_M1_PCB_Layout_Constraints_v0.1.md)',
              '- [M1-MECH-A Display FPC Physical Orientation v0.1](docs/Pajoniiir_M1_MECH_A_Display_FPC_Physical_Orientation_v0.1.md)\n- [M1-MECH-A Fabrication Stackup Closure v0.1](docs/Pajoniiir_M1_MECH_A_Fabrication_Stackup_Closure_v0.1.md)\n- [M1-MECH-A Physical Evidence Boundary v0.1](docs/Pajoniiir_M1_MECH_A_Physical_Evidence_Boundary_v0.1.md)\n- [PCB placement & routing constraints v0.1](docs/Pajoniiir_M1_PCB_Layout_Constraints_v0.1.md)'
          )

          # Schematic audit source snapshot.
          replace_exact(
              'docs/Pajoniiir_M1_Schematic_Audit_v0.1.md',
              'Trenutni M1-MECH-A8 source baseline ima 269 `in_bom=yes` RefDes-a, 16 DNP stavki i 11 dopuštenih blank-footprint manufacturing gateova.',
              'Trenutni M1-MECH-A12 source baseline ima 269 `in_bom=yes` RefDes-a, 16 DNP stavki i 10 dopuštenih blank-footprint manufacturing gateova; D1 je sada stvarno footprint-lockan kao ST SMBJ6.0CA-TR / `Diode_SMD:D_SMB`.'
          )
          replace_exact(
              'docs/Pajoniiir_M1_Schematic_Audit_v0.1.md',
              '- [x] historical run #76 engineering/manual BOM review — 270/270, 17 DNP, 12 intentional blank gates; M1-MECH-A8 source baseline is 269/16/11 after intentional J6 removal',
              '- [x] historical run #76 engineering/manual BOM review — 270/270, 17 DNP, 12 intentional blank gates; current M1-MECH-A12 source baseline is 269/16/10 after J6 removal and D1 footprint lock'
          )

          # Engineering BOM display gate is narrowed by A9/A10.
          replace_exact(
              'docs/Pajoniiir_Mainboard_BOM_v0.2.md',
              '| J_LCD | 1 | **SOFNG 0.5TBQP-30P-1 / JLCPCB C3975120 — 30 contacts, 0.5 mm pitch; footprint still TBD-MECH pending contact-side/mating geometry, Altium 31/32 interpretation, pins 15/16/18/19 and panel 3V3 commonality** |',
              '| J_LCD | 1 | **SOFNG 0.5TBQP-30P-1 / JLCPCB C3975120 — 30 contacts, 0.5 mm pitch; A9 resolves 31/32 as GND shell/mount refs and 15/16/18/19 as NC; A10 confirms component-side side-entry; footprint remains blocked by final panel variant, top/bottom contact-side, exact mated Z and panel 3V3 commonality** |'
          )

          # Readiness summary.
          replace_exact(
              'docs/Pajoniiir_RevA_Schematic_Readiness_Review_v0.1.md',
              '- generated manufacturing BOM/netlist parity review complete (historical run #76: 270/270; current M1-MECH-A8 source baseline: 269 after intentional J6 removal)',
              '- generated manufacturing BOM/netlist parity review complete (historical run #76: 270/270; current M1-MECH-A12 source baseline: 269 in-BOM / 16 DNP / 10 intentional blank gates)'
          )
          replace_exact(
              'docs/Pajoniiir_RevA_Schematic_Readiness_Review_v0.1.md',
              'Remaining before final manufacturing sign-off:\n\n- display and connector mechanical closure',
              'Remaining before final manufacturing sign-off:\n\n- 12 physical/EVT layout blockers listed in `Pajoniiir_M1_MECH_A_Physical_Evidence_Boundary_v0.1.md`\n- exact controlled-impedance width/spacing calculation for locked JLC04161H-7628 stackup before routing freeze'
          )

          # Final anti-stale checks on the files touched here.
          checks = {
              'README.md': ['M1-MECH-A8 source baseline 269 in-BOM, 16 DNP, 11', 'M1-MECH-A10 additionally confirms'],
              'docs/Pajoniiir_M1_Schematic_Audit_v0.1.md': ['M1-MECH-A8 source baseline ima 269', 'source baseline is 269/16/11'],
              'docs/Pajoniiir_Mainboard_BOM_v0.2.md': ['Altium 31/32 interpretation, pins 15/16/18/19'],
          }
          for path, stale in checks.items():
              text = Path(path).read_text(encoding='utf-8')
              found = [needle for needle in stale if needle in text]
              if found:
                  raise SystemExit(f'{path}: stale strings remain: {found}')
          print('final MECH-A docs sync PASS')
          PY

      - name: Remove one-shot workflow and commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/finalize-mech-a-docs.yml
          git add README.md docs/Pajoniiir_M1_Schematic_Audit_v0.1.md docs/Pajoniiir_Mainboard_BOM_v0.2.md docs/Pajoniiir_RevA_Schematic_Readiness_Review_v0.1.md
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'docs: synchronize final M1-MECH-A12 status'
          git push origin HEAD:main

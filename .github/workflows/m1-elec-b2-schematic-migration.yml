name: M1 ELEC B2 DSI506 schematic migration

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/m1-elec-b2-schematic-migration.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply deterministic schematic migration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations
          from pathlib import Path
          import json, re, uuid

          B = Path('hardware/Pajoniiir-M1')
          P10 = B/'10_DISPLAY_MIPI.kicad_sch'
          P11 = B/'11_TOUCH_GT911.kicad_sch'
          P03 = B/'03_P4_CORE.kicad_sch'
          ROOT = B/'Pajoniiir-M1.kicad_sch'
          VAL = B/'tools/validate_schematic_structure.py'
          GATES = B/'mechanical_gates.json'
          FD = B/'final_display_module.json'
          DC = B/'display_connector_b1.json'
          NS = uuid.UUID('8dce17f3-2fbe-4a6d-9c87-c154dc9f7a10')
          SHEET10_PATH='/2c8dd352-b7b8-4d9e-8f93-5dd43be2a100/3100000a-6b2a-4a3a-8c91-00000000000a'

          def U(key:str)->str:
              return str(uuid.uuid5(NS,key))

          def sexpr_at(text:str,start:int):
              depth=0; ins=False; esc=False; begun=False
              for i in range(start,len(text)):
                  ch=text[i]
                  if ins:
                      if esc: esc=False; continue
                      if ch=='\\': esc=True; continue
                      if ch=='"': ins=False
                      continue
                  if ch=='"': ins=True; continue
                  if ch=='(':
                      depth+=1; begun=True
                  elif ch==')':
                      depth-=1
                      if begun and depth==0: return text[start:i+1],i+1
              raise ValueError(f'unterminated sexpr at {start}')

          def top_blocks(text:str, token:str):
              needle='\n  ('+token; pos=0
              while True:
                  f=text.find(needle,pos)
                  if f<0: return
                  s=f+1; block,e=sexpr_at(text,s); yield s,e,block; pos=e

          def extract_lib(text:str):
              s=text.index('  (lib_symbols')
              block,e=sexpr_at(text,s)
              return text[:s],block,e

          def balance(text:str):
              d=0; mn=0; ins=False; esc=False
              for ch in text:
                  if ins:
                      if esc: esc=False; continue
                      if ch=='\\': esc=True; continue
                      if ch=='"': ins=False
                      continue
                  if ch=='"': ins=True
                  elif ch=='(': d+=1
                  elif ch==')': d-=1; mn=min(mn,d)
              return d,mn

          eff='(effects (font (size 1.27 1.27)))'
          hide='(effects (font (size 1.27 1.27)) (hide yes))'

          def inst(lib,x,y,rot,ref,val,fp='',ds='~',pins=2,dnp=False,key=None):
              key=key or ref
              pin_s=' '.join(f'(pin "{i}" (uuid "{U(key+"-pin-"+str(i))}"))' for i in range(1,pins+1))
              return f'''  (symbol
            (lib_id "{lib}") (at {x} {y} {rot}) (unit 1)
            (exclude_from_sim no) (in_bom yes) (on_board yes) (dnp {'yes' if dnp else 'no'}) (uuid "{U(key+'-sym')}")
            (property "Reference" "{ref}" (at {x+3} {y-2} 0) {eff})
            (property "Value" "{val}" (at {x+3} {y+2} 0) {eff})
            (property "Footprint" "{fp}" (at {x} {y} 0) {hide})
            (property "Datasheet" "{ds}" (at {x} {y} 0) {hide})
            {pin_s}
            (instances (project "Pajoniiir-M1" (path "{SHEET10_PATH}" (reference "{ref}") (unit 1))))
          )\n'''

          def wire(x1,y1,x2,y2,key):
              return f'  (wire (pts (xy {x1} {y1}) (xy {x2} {y2})) (stroke (width 0) (type default)) (uuid "{U(key)}"))\n'
          def label(name,x,y,key):
              return f'  (label "{name}" (at {x} {y} 0) {eff} (uuid "{U(key)}"))\n'
          def hier(name,shape,x,y,key):
              return f'  (hierarchical_label "{name}" (shape {shape}) (at {x} {y} 0) {eff} (uuid "{U(key)}"))\n'
          def gnd(x,y,key):
              return inst('power:GND',x,y,0,f'#PWRB2{key}', 'GND','', '',1,False,'gnd-'+key)
          def tp(ref,val,x,y,key):
              return inst('Connector:TestPoint',x,y,0,ref,val,'TestPoint:TestPoint_Pad_D1.5mm','~',1,False,key)

          # ---------- Rebuild sheet 10 from the proven P4 DSI PHY outward ----------
          old10=P10.read_text()
          prefix10,lib10,_=extract_lib(old10)
          prefix10=re.sub(r'\(title "[^"]*"\)', '(title "Pajoniiir-M1 Rev A — 10_DISPLAY_DSI506")', prefix10, count=1)
          prefix10=re.sub(r'\(date "[^"]*"\)', '(date "2026-09-04")', prefix10, count=1)
          prefix10=re.sub(r'\(rev "[^"]*"\)', '(rev "B / M1-ELEC-B2")', prefix10, count=1)
          prefix10=re.sub(r'\(comment 1 "[^"]*"\)', '(comment 1 "DSI506/DYL0023 5in module; M3 bench-proven 15-pin interface")', prefix10, count=1)
          prefix10=re.sub(r'\(comment 2 "[^"]*"\)', '(comment 2 "1-lane firmware baseline; route both DSI data lanes; module handles touch/backlight")', prefix10, count=1)

          # Embedded custom 15-pin connector symbol. All pins are passive so the
          # connector itself does not create false ERC driver-direction semantics.
          pins=[
              (1,'GND'),(2,'DSI_D1_N'),(3,'DSI_D1_P'),(4,'GND'),(5,'DSI_CLK_N'),
              (6,'DSI_CLK_P'),(7,'GND'),(8,'DSI_D0_N'),(9,'DSI_D0_P'),(10,'GND'),
              (11,'I2C_SCL'),(12,'I2C_SDA'),(13,'GND'),(14,'3V3'),(15,'3V3')]
          pin_defs=[]
          for i,(num,name) in enumerate(pins):
              ly=17.78-i*2.54
              pin_defs.append(f'''        (pin passive line (at -7.62 {ly:.2f} 0) (length 2.54)
              (name "{name}" {eff}) (number "{num}" {eff}))''')
          custom=f'''\n    (symbol "Pajoniiir-M1:DSI506_15PIN"
      (pin_names (offset 1.016))
      (exclude_from_sim no) (in_bom yes) (on_board yes)
      (property "Reference" "J" (at 0 22.86 0) {eff})
      (property "Value" "DSI506_15PIN" (at 0 20.32 0) {eff})
      (property "Footprint" "Pajoniiir-M1:Amphenol_SFW15R-2STE1LF" (at 0 0 0) {hide})
      (property "Datasheet" "https://cdn.amphenol-cs.com/media/wysiwyg/files/drawing/10172241.pdf" (at 0 0 0) {hide})
      (symbol "DSI506_15PIN_0_1"
        (rectangle (start -5.08 19.05) (end 5.08 -19.05) (stroke (width 0.254) (type default)) (fill (type background)))
      )
      (symbol "DSI506_15PIN_1_1"
{chr(10).join(pin_defs)}
      )
      (embedded_fonts no)
    )\n'''
          lib10=lib10[:-1]+custom+'  )'

          body=[]
          # Display-module rail: preserve FB3/C93/C94/TP1 refdes but rename rail.
          body.append(hier('3V3_SYS','input',30,30,'h-3v3'))
          body.append(inst('Device:R_US',60,30,90,'FB3','0R / ferrite option','Resistor_SMD:R_0603_1608Metric','~',2,False,'FB3'))
          body.append(wire(30,30,56.19,30,'w-3v3-in'))
          body.append(wire(63.81,30,120,30,'w-3v3-out'))
          body.append(label('3V3_DISPLAY_MODULE',90,30,'l-3v3-module'))
          for ref,x,val,fp in [('C93',75,'100nF','Capacitor_SMD:C_0603_1608Metric'),('C94',90,'10uF','Capacitor_SMD:C_0805_2012Metric')]:
              cy=33.81
              body.append(inst('Device:C',x,cy,0,ref,val,fp,'~',2,False,ref))
              body.append(label('3V3_DISPLAY_MODULE',x,30,'l-'+ref+'-v'))
              body.append(gnd(x,37.62,ref))
          body.append(tp('TP1','3V3_DISPLAY_MODULE',120,30,'TP1'))
          body.append(label('3V3_DISPLAY_MODULE',120,30,'l-tp1'))

          # DPHY rail is generated in P4 core; retain observation point only.
          body.append(hier('P4_LDO_MIPI_2V5','input',30,40,'h-mipi25'))
          body.append(tp('TP2','P4_LDO_MIPI_2V5',120,40,'TP2'))
          body.append(label('P4_LDO_MIPI_2V5',120,40,'l-tp2'))

          dsi=[
              ('DSI_D0_P','R82','J8_DSI_D0_P',50),('DSI_D0_N','R83','J8_DSI_D0_N',58),
              ('DSI_D1_P','R84','J8_DSI_D1_P',66),('DSI_D1_N','R85','J8_DSI_D1_N',74),
              ('DSI_CLK_P','R86','J8_DSI_CLK_P',82),('DSI_CLK_N','R87','J8_DSI_CLK_N',90)]
          for net,ref,out,y in dsi:
              body.append(hier(net,'bidirectional',30,y,'h-'+net))
              body.append(inst('Device:R_US',65,y,90,ref,'0R','Resistor_SMD:R_0201_0603Metric','~',2,False,ref))
              body.append(wire(30,y,61.19,y,'w-'+ref+'-in'))
              body.append(wire(68.81,y,100,y,'w-'+ref+'-out'))
              body.append(label(out,100,y,'l-'+out))

          # Shared module I2C: GPIO7/8, M3 hardware-accepted at 100 kHz.
          for net,ref,out,y in [('DISPLAY_I2C_SDA','R95','J8_I2C_SDA',108),('DISPLAY_I2C_SCL','R96','J8_I2C_SCL',118)]:
              body.append(hier(net,'bidirectional',30,y,'h-'+net))
              body.append(inst('Device:R_US',65,y,90,ref,'22R','Resistor_SMD:R_0402_1005Metric','~',2,False,ref))
              body.append(wire(30,y,61.19,y,'w-'+ref+'-in'))
              body.append(wire(68.81,y,100,y,'w-'+ref+'-out'))
              body.append(label(out,100,y,'l-'+out))
          # Default pull-ups plus DNP parallel tuning footprints on module side.
          for ref,x,y,out,dnp in [
              ('R97',110,104.19,'J8_I2C_SDA',False),('R99',120,104.19,'J8_I2C_SDA',True),
              ('R98',110,114.19,'J8_I2C_SCL',False),('R100',120,114.19,'J8_I2C_SCL',True)]:
              body.append(inst('Device:R_US',x,y,0,ref,'4.7k DNP' if dnp else '4.7k','Resistor_SMD:R_0603_1608Metric','~',2,dnp,ref))
              body.append(label('3V3_DISPLAY_MODULE',x,y-3.81,'l-'+ref+'-v'))
              body.append(label(out,x,y+3.81,'l-'+ref+'-bus'))
          body.append(tp('TP9','J8_I2C_SDA',135,108,'TP9')); body.append(label('J8_I2C_SDA',135,108,'l-tp9'))
          body.append(tp('TP10','J8_I2C_SCL',145,118,'TP10')); body.append(label('J8_I2C_SCL',145,118,'l-tp10'))

          # J8 final production connector.
          body.append(inst('Pajoniiir-M1:DSI506_15PIN',210,90,0,'J8','DSI506 / DYL0023 15-pin DSI','Pajoniiir-M1:Amphenol_SFW15R-2STE1LF','https://cdn.amphenol-cs.com/media/wysiwyg/files/drawing/10172241.pdf',15,False,'J8'))
          jmap={1:'GND',2:'J8_DSI_D1_N',3:'J8_DSI_D1_P',4:'GND',5:'J8_DSI_CLK_N',6:'J8_DSI_CLK_P',7:'GND',8:'J8_DSI_D0_N',9:'J8_DSI_D0_P',10:'GND',11:'J8_I2C_SCL',12:'J8_I2C_SDA',13:'GND',14:'3V3_DISPLAY_MODULE',15:'3V3_DISPLAY_MODULE'}
          for i in range(1,16):
              ly=17.78-(i-1)*2.54
              gx=202.38; gy=90-ly
              net=jmap[i]
              if net=='GND': body.append(gnd(gx,gy,'j8-'+str(i)))
              else: body.append(label(net,gx,gy,'j8-pin-'+str(i)))

          body.append('  (text "FINAL DISPLAY: EYOYO DSI506 / DYL0023, 5in 800x480; interface bench-accepted in Pajoniiir-M3." (exclude_from_sim no) (at 150 20 0) '+eff+' (uuid "'+U('note1')+'"))\n')
          body.append('  (text "J8 = Amphenol SFW15R-2STE1LF, 15P 1.0mm TOP contact. Pin map follows M3 accepted J2: GND/D1/CLK/D0/I2C/3V3." (exclude_from_sim no) (at 150 25 0) '+eff+' (uuid "'+U('note2')+'"))\n')
          body.append('  (text "Backlight/panel power are controlled inside the module over I2C 0x45; touch is 0x38 at 100kHz. No MP3202, LEDA/LEDK, LCD_RST, TE or external BL PWM on M1." (exclude_from_sim no) (at 150 30 0) '+eff+' (uuid "'+U('note3')+'"))\n')
          body.append('  (text "Initial firmware: 1 data lane @ 800Mbps, RGB888, 27.777MHz, H 59/2/45, V 109/2/22; both physical data lanes are routed." (exclude_from_sim no) (at 150 35 0) '+eff+' (uuid "'+U('note4')+'"))\n')
          body.append('  (text "DSI routing target 100R differential; MIPI DPHY 2.5V LDO and 4.02k DSI_REXT remain in 03_P4_CORE." (exclude_from_sim no) (at 150 40 0) '+eff+' (uuid "'+U('note5')+'"))\n')
          body.append('  (sheet_instances (path "/" (page "11")))\n  (embedded_fonts no)\n)\n')
          new10=prefix10+lib10+'\n'+''.join(body)
          if balance(new10)!=(0,0): raise SystemExit(f'10 balance {balance(new10)}')
          for forbidden in ['MP3202DJ-LF-Z','LEDA','LEDK','PANEL_LCD_RST','PANEL_LCD_TE','SOFNG 0.5TBQP-30P-1','LCD_BL_PWM']:
              if forbidden in new10: raise SystemExit(f'legacy display token remains in active sheet10: {forbidden}')
          for req in ['(property "Reference" "J8"','SFW15R-2STE1LF','DSI506 / DYL0023','DISPLAY_I2C_SDA','DISPLAY_I2C_SCL']:
              if req not in new10: raise SystemExit(f'missing new display token {req}')
          P10.write_text(new10)

          # ---------- Retire separate GT911 sheet; support is integrated into sheet10 ----------
          old11=P11.read_text(); prefix11,lib11,_=extract_lib(old11)
          prefix11=re.sub(r'\(title "[^"]*"\)', '(title "Pajoniiir-M1 Rev A — 11_TOUCH_GT911 RETIRED")', prefix11, count=1)
          prefix11=re.sub(r'\(date "[^"]*"\)', '(date "2026-09-04")', prefix11, count=1)
          prefix11=re.sub(r'\(rev "[^"]*"\)', '(rev "B / M1-ELEC-B2")', prefix11, count=1)
          prefix11=re.sub(r'\(comment 1 "[^"]*"\)', '(comment 1 "Retired: final DSI506 touch is integrated through J8 shared I2C")', prefix11, count=1)
          prefix11=re.sub(r'\(comment 2 "[^"]*"\)', '(comment 2 "No GT911 RST/INT/address-select network on final M1")', prefix11, count=1)
          stub='''\n  (text "M1-ELEC-B2: separate GT911 support retired. Final DSI506/DYL0023 touch is module-integrated at I2C 0x38." (exclude_from_sim no) (at 35 55 0) '''+eff+''' (uuid "'''+U('stub1')+'''"))
  (text "GPIO7/8 I2C conditioning, pull-ups and test points moved into 10_DISPLAY_MIPI next to final J8 connector." (exclude_from_sim no) (at 35 60 0) '''+eff+''' (uuid "'''+U('stub2')+'''"))
  (text "GPIO3 TOUCH_RST and GPIO4 TOUCH_INT are released/NC in final M1 architecture." (exclude_from_sim no) (at 35 65 0) '''+eff+''' (uuid "'''+U('stub3')+'''"))
  (sheet_instances (path "/" (page "12")))
  (embedded_fonts no)
)
'''
          new11=prefix11+lib11+stub
          if balance(new11)!=(0,0): raise SystemExit(f'11 balance {balance(new11)}')
          for token in ['(property "Reference" "R95"','(property "Reference" "R101"','(property "Reference" "TP11"','hierarchical_label']:
              if token in new11: raise SystemExit(f'active legacy touch content remains: {token}')
          P11.write_text(new11)

          # ---------- P4: release obsolete GPIO3/4/5/6/23 and rename shared I2C ----------
          p03=P03.read_text()
          p03=p03.replace('"I2C_SDA"','"DISPLAY_I2C_SDA"').replace('"I2C_SCL"','"DISPLAY_I2C_SCL"')
          release={'TOUCH_RST','TOUCH_INT','LCD_RST','LCD_TE','LCD_BL_PWM'}
          repl=[]
          for s,e,b in list(top_blocks(p03,'hierarchical_label')):
              m=re.search(r'\(hierarchical_label "([^"]+)".*?\(at\s+([-0-9.]+)\s+([-0-9.]+)',b,re.S)
              if m and m.group(1) in release:
                  name,x,y=m.group(1),m.group(2),m.group(3)
                  uid=re.search(r'\(uuid "([^"]+)"\)',b).group(1)
                  repl.append((s,e,f'  (no_connect (at {x} {y}) (uuid "{uid}"))'))
          if len(repl)!=5: raise SystemExit(f'expected five released P4 labels, got {len(repl)}')
          for s,e,n in reversed(repl): p03=p03[:s]+n+p03[e:]
          if balance(p03)!=(0,0): raise SystemExit(f'03 balance {balance(p03)}')
          for n in release:
              if f'hierarchical_label "{n}"' in p03: raise SystemExit(f'P4 old hierarchy remains {n}')
          P03.write_text(p03)

          # ---------- Root hierarchy: preserve DSI, move I2C to sheet10, retire sheet11 ----------
          root=ROOT.read_text()
          # Rename the P4 shared I2C net globally first.
          root=root.replace('"I2C_SDA"','"DISPLAY_I2C_SDA"').replace('"I2C_SCL"','"DISPLAY_I2C_SCL"')

          # Locate sheet blocks by Sheetname.
          sheets={}
          for s,e,b in top_blocks(root,'sheet'):
              m=re.search(r'\(property "Sheetname" "([^"]+)"',b)
              if m: sheets[m.group(1)]=(s,e,b)
          for name in ['03_P4_CORE','10_DISPLAY_MIPI','11_TOUCH_GT911']:
              if name not in sheets: raise SystemExit(f'missing root sheet {name}')

          prune_coords=set()
          def pin_coords(block,names=None):
              out=[]
              for m in re.finditer(r'\(pin "([^"]+)"[^\n]*?\(at\s+([-0-9.]+)\s+([-0-9.]+)',block):
                  if names is None or m.group(1) in names: out.append((m.group(1),float(m.group(2)),float(m.group(3))))
              return out

          p4s,p4e,p4b=sheets['03_P4_CORE']
          olds={'TOUCH_RST','TOUCH_INT','LCD_RST','LCD_TE','LCD_BL_PWM'}
          prune_coords.update((x,y) for _,x,y in pin_coords(p4b,olds))
          p4b=re.sub(r'\n    \(pin "(?:TOUCH_RST|TOUCH_INT|LCD_RST|LCD_TE|LCD_BL_PWM)"[^\n]+\)','',p4b)

          d10s,d10e,d10b=sheets['10_DISPLAY_MIPI']
          # Remove no-longer-used display pins; repurpose LCD_RST/TE physical slots for I2C.
          prune_coords.update((x,y) for _,x,y in pin_coords(d10b,{'5V_SYS','3V3_LCD','LCD_BL_PWM'}))
          d10b=re.sub(r'\n    \(pin "(?:5V_SYS|3V3_LCD|LCD_BL_PWM)"[^\n]+\)','',d10b)
          d10b=d10b.replace('(pin "LCD_RST" input','(pin "DISPLAY_I2C_SDA" bidirectional')
          d10b=d10b.replace('(pin "LCD_TE" bidirectional','(pin "DISPLAY_I2C_SCL" bidirectional')

          t11s,t11e,t11b=sheets['11_TOUCH_GT911']
          prune_coords.update((x,y) for _,x,y in pin_coords(t11b,None))
          t11b=re.sub(r'\n    \(pin "[^"]+"[^\n]+\)','',t11b)

          # Apply sheet replacements back-to-front.
          reps=[(p4s,p4e,p4b),(d10s,d10e,d10b),(t11s,t11e,t11b)]
          for s,e,b in sorted(reps,reverse=True): root=root[:s]+b+root[e:]

          # Remove old root labels and any wires touching pruned hierarchy pin coordinates.
          kill_names={'TOUCH_RST','TOUCH_INT','LCD_BL_PWM','3V3_LCD'}
          rm=[]
          for s,e,b in top_blocks(root,'label'):
              m=re.search(r'\(label "([^"]+)".*?\(at\s+([-0-9.]+)\s+([-0-9.]+)',b,re.S)
              if m and (m.group(1) in kill_names or (float(m.group(2)),float(m.group(3))) in prune_coords): rm.append((s,e))
          for s,e,b in top_blocks(root,'wire'):
              pts=[(float(x),float(y)) for x,y in re.findall(r'\(xy\s+([-0-9.]+)\s+([-0-9.]+)\)',b)]
              if any(p in prune_coords for p in pts): rm.append((s,e))
          for s,e in sorted(set(rm),reverse=True): root=root[:s]+root[e:]

          # Root labels on the former LCD_RST/TE display-sheet wires become shared I2C.
          root=root.replace('(label "LCD_RST"','(label "DISPLAY_I2C_SDA"')
          root=root.replace('(label "LCD_TE"','(label "DISPLAY_I2C_SCL"')
          if balance(root)!=(0,0): raise SystemExit(f'root balance {balance(root)}')
          for n in olds:
              if f'(pin "{n}"' in root or f'(label "{n}"' in root: raise SystemExit(f'root legacy control remains {n}')
          if root.count('DISPLAY_I2C_SDA') < 2 or root.count('DISPLAY_I2C_SCL') < 2: raise SystemExit('root display I2C continuity markers missing')
          ROOT.write_text(root)

          # ---------- Machine authorities ----------
          gates=json.loads(GATES.read_text())
          gate=next(g for g in gates['gates'] if g['id']=='J_LCD_DISPLAY_FPC')
          gate.update({
              'sheet':'10_DISPLAY_MIPI','refdes':'J8','category':'display_module_connector_mechanical','status':'open',
              'allow_blank_footprint':False,'bom_scope':True,'blocks_layout_freeze':True,
              'exact_mpn':'SFW15R-2STE1LF','manufacturer':'Amphenol Communications Solutions / FCI',
              'exact_footprint':'Pajoniiir-M1:Amphenol_SFW15R-2STE1LF','contact_count':15,'pitch_mm':1.0,
              'contact_location':'top','connector_orientation':'right-angle / side-entry SMT ZIF',
              'electrical_pin_map_status':'LOCKED_M1-ELEC-B0','schematic_status':'INSTANTIATED_M1-ELEC-B2',
              'footprint_status':'DRAWING_VERIFIED_M1-ELEC-B2',
              'required_evidence':['actual DSI506 FFC conductor-side / host-to-module pin-1 continuity check','FFC bend/insertion keepout in final enclosure','absolute J8 XY/Z placement relative to final display and custom mainboard'],
              'closure':'Electrical connector, MPN and footprint are locked/instantiated. Gate remains open only for actual cable orientation and final enclosure placement evidence.'
          })
          gates['updated']='2026-09-04'; GATES.write_text(json.dumps(gates,indent=2)+'\n')

          fd=json.loads(FD.read_text())
          if 'M1-ELEC-B2' not in fd['milestones']: fd['milestones'].append('M1-ELEC-B2')
          fd['status']='final_DSI506_selected__M3_pinout_locked__J8_schematic_and_footprint_instantiated__cable_and_enclosure_open'
          fd['freeze']['production_connector_mpn_locked']=True
          fd['freeze']['production_connector_contact_side_locked']=True
          fd['freeze']['production_connector_footprint_locked']=True
          fd['freeze']['schematic_migrated_to_final_display']=True
          fd['updated']='2026-09-04'; FD.write_text(json.dumps(fd,indent=2)+'\n')

          dc=json.loads(DC.read_text())
          dc['footprint']['status']='DRAWING_VERIFIED_AND_COMMITTED_M1-ELEC-B2'
          dc['footprint']['drawing_checks']=['15 contacts at 1.00 mm pitch / 14.00 mm centre span','signal pads 0.60 x 2.00 mm','two unnumbered mounting-plate solder pads 0.70 x 4.20 mm at +/-8.00 mm','mounting plates bracket contact row','temporary converter 3D path removed','footprint attr normalized to SMD']
          gate_text='final dimension-by-dimension pad/mounting-plate/courtyard audit against Amphenol drawing 10172241'
          if gate_text in dc['still_open']: dc['still_open'].remove(gate_text)
          DC.write_text(json.dumps(dc,indent=2)+'\n')

          # ---------- Replace stale structural display contract ----------
          val=VAL.read_text()
          start=val.index('    if \'(property "Reference" "J_LCD"\' in p10:')
          end=val.index('\n\n    # 7. ESP32-P4 multi-unit GPIO connectivity contract.',start)
          newcheck='''    # M1-ELEC-B2 final DSI506 display contract.\n    if '(property "Reference" "J8"' not in p10:\n        errors.append("final DSI506 J8 connector missing")\n    for token in (\n        "DSI506 / DYL0023",\n        "SFW15R-2STE1LF",\n        "Pajoniiir-M1:Amphenol_SFW15R-2STE1LF",\n        "DISPLAY_I2C_SDA",\n        "DISPLAY_I2C_SCL",\n    ):\n        if token not in p10:\n            errors.append(f"final DSI506 display contract token missing: {token}")\n    for legacy in (\n        "SOFNG 0.5TBQP-30P-1",\n        "MP3202DJ-LF-Z",\n        "LEDA",\n        "LEDK",\n        "PANEL_LCD_RST",\n        "PANEL_LCD_TE",\n        "LCD_BL_PWM",\n    ):\n        if legacy in p10:\n            errors.append(f"legacy 4.3-inch display implementation remains active: {legacy}")\n    if any(True for _ in instantiated_symbol_blocks(child_text.get("11_TOUCH_GT911", ""))):\n        errors.append("retired 11_TOUCH_GT911 sheet must contain no instantiated components")\n    if "separate GT911 support retired" not in child_text.get("11_TOUCH_GT911", ""):\n        errors.append("retired GT911 sheet migration annotation missing")\n    p03 = child_text.get("03_P4_CORE", "")\n    for legacy_hier in ("TOUCH_RST", "TOUCH_INT", "LCD_RST", "LCD_TE", "LCD_BL_PWM"):\n        if f'hierarchical_label "{legacy_hier}"' in p03:\n            errors.append(f"released display GPIO still exported by P4 core: {legacy_hier}")\n    if "DISPLAY_I2C_SDA" not in p03 or "DISPLAY_I2C_SCL" not in p03:\n        errors.append("P4 final display I2C hierarchy missing")\n'''
          val=val[:start]+newcheck+val[end:]
          VAL.write_text(val)

          # Final source guards before KiCad load.
          for p in [P10,P11,P03,ROOT]:
              if balance(p.read_text())!=(0,0): raise SystemExit(f'post-write imbalance: {p}')
          print('PASS: B2 source transformation complete')
          print('PASS: J8 instantiated with Amphenol footprint')
          print('PASS: legacy MP3202/GT911 control paths removed from active hierarchy')
          PY

      - name: Install KiCad 9 and preflight-load migrated hierarchy
        shell: bash
        run: |
          set -euo pipefail
          sudo add-apt-repository --yes ppa:kicad/kicad-9.0-releases >/dev/null
          sudo apt-get update -qq
          sudo apt-get install --yes --no-install-recommends kicad kicad-symbols kicad-footprints >/dev/null
          kicad-cli version
          python3 hardware/Pajoniiir-M1/tools/validate_schematic_structure.py
          mkdir -p /tmp/m1-b2
          kicad-cli sch export pdf -o /tmp/m1-b2/root.pdf hardware/Pajoniiir-M1/Pajoniiir-M1.kicad_sch
          test -s /tmp/m1-b2/root.pdf
          kicad-cli sch export netlist -o /tmp/m1-b2/root.net hardware/Pajoniiir-M1/Pajoniiir-M1.kicad_sch
          grep -q 'J8' /tmp/m1-b2/root.net
          echo 'PASS: root hierarchy loads and J8 appears in generated netlist'

      - name: Commit migration and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/m1-elec-b2-schematic-migration.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hardware/Pajoniiir-M1/03_P4_CORE.kicad_sch hardware/Pajoniiir-M1/10_DISPLAY_MIPI.kicad_sch hardware/Pajoniiir-M1/11_TOUCH_GT911.kicad_sch hardware/Pajoniiir-M1/Pajoniiir-M1.kicad_sch hardware/Pajoniiir-M1/tools/validate_schematic_structure.py hardware/Pajoniiir-M1/mechanical_gates.json hardware/Pajoniiir-M1/final_display_module.json hardware/Pajoniiir-M1/display_connector_b1.json .github/workflows/m1-elec-b2-schematic-migration.yml
          git diff --cached --check
          git commit -m 'display: migrate schematic to final DSI506 module'
          git push origin HEAD:main

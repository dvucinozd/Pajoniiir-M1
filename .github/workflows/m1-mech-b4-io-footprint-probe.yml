name: M1 MECH B4 Switchcraft drawing geometry probe

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/m1-mech-b4-io-footprint-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Extract spatial text from released Switchcraft drawing
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install --yes --no-install-recommends poppler-utils >/dev/null
          mkdir -p /tmp/drawings
          curl -fL --retry 3 --retry-delay 1 \
            'https://www.switchcraft.com/assets/1/24/7_%20_RAHLP%20SERIES_CD_REV0A.pdf?7826=' \
            -o /tmp/drawings/switchcraft.pdf
          pdfinfo /tmp/drawings/switchcraft.pdf
          pdftotext -layout /tmp/drawings/switchcraft.pdf /tmp/drawings/switchcraft.txt
          echo '===== SWITCHCRAFT LAYOUT TEXT ====='
          cat /tmp/drawings/switchcraft.txt
